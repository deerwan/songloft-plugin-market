name: 提交插件源
description: 提交你的个人插件源（registry.json）地址，每位开发者只需提交一次，审核通过后自动收录
title: "[Source] 插件源名称"
labels: ["source-submit"]
body:
  - type: markdown
    attributes:
      value: |
        提交你的**个人插件源**（`registry.json`）地址。每位开发者只需提交一次：之后新插件直接加入自己的 registry.json，下次构建即自动收录，无需重复提交。

        注意：源地址必须**公开可访问**（GitHub 建议用 `raw.githubusercontent.com` 链接，Gitee 用 `raw.giteeusercontent.com` 链接）。若还没有源，请先参考[插件源制作指南](https://songloft.hanxi.cc/plugin_registry)制作。
  - type: input
    id: source-url
    attributes:
      label: 插件源地址（必填）
      description: 你的个人插件源 registry.json URL，需为 https 且可访问。
      placeholder: https://raw.githubusercontent.com/your/repo/main/registry.json
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认项
      options:
        - label: 该源可公开访问，且我已自测能正常解析。
          required: true
        - label: 该源中的插件不含恶意代码。
          required: true
