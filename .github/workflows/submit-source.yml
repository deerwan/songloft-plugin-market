name: Submit Source

# 维护者在提交 Issue 上打 `approved` 标签后触发：
#   1. 解析 Issue 正文里的源地址
#   2. 用 `npm run validate:source` 校验（复用现有构建管线的 dry-run）
#   3. 校验通过 → 追加进 data/sources.json 并直接提交到 main（不带 [skip ci]，
#      触发 build.yml 自动构建 + 部署，前端自动收录该源下的全部插件）；
#      失败 → 在 Issue 留言报错。
#
# 触发条件：`approved` 标签（无论 Issue 是否带 source-submit，
# 这样手动建的 Issue 也能走通流程；用模板提交的会自动带 source-submit，无害）；
# 另支持 workflow_dispatch 手动触发（填 source_url 可绕过 Issue 解析）。
# 需要仓库 Secrets: PAT_TOKEN（含 contents:write，用于直接向 main 推送）

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      source_url:
        description: '插件源 URL（registry.json，手动触发时填写，可选）'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  submit-source:
    # 仅在「打 approved 标签」或手动触发时执行
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 解析 + 校验（失败不阻断 job，下一步据 output 留言）
      - name: Parse & validate source
        id: validate
        env:
          BODY: ${{ github.event.issue.body }}
          MANUAL_URL: ${{ github.event.inputs.source_url }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            OUT="$MANUAL_URL"
          else
            printf '%s' "$BODY" > /tmp/issue_body.txt
            OUT=$(node scripts/parse_submission.mjs /tmp/issue_body.txt) || {
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "error_msg=无法从 Issue 解析出源地址（URL），请检查是否填写了合法的 http(s) 链接。" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          URL=$(printf '%s' "$OUT" | sed -n '1p')
          NAME=$(printf '%s' "$OUT" | sed -n '2p')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # 早拦截：源地址必须以 registry.json 结尾（允许 ?/# 查询串），
          # 避免把 HTML/Markdown 等非 JSON 文档页（如 plugin_registry.html 指南页）当作插件源收录。
          if printf '%s' "$URL" | grep -qE 'registry\.json([?#].*)?$'; then
            echo "源地址以 registry.json 结尾，进入校验：$URL"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "error_msg=源地址必须以 registry.json 结尾。请先制作个人插件源（含 plugins 数组的 registry.json）再提交，参考插件源制作指南：https://songloft.hanxi.cc/plugin_registry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 早拦截：每位开发者只收录一个个人插件源（同平台同账号）。同一账号已有源时，
          # 引导其直接把新插件加进已有 registry.json，而不是再提交第二个源。
          DUP_NAME=$(CHECK_URL="$URL" node -e '
            const fs = require("fs");
            const host = (u) => {
              const m = u.match(/(?:github\.com|raw\.githubusercontent\.com|gitee\.com|raw\.giteeusercontent\.com)\/([^\/]+)\//i);
              return m ? m[1].toLowerCase() : "";
            };
            const owner = host(process.env.CHECK_URL);
            if (!owner) process.exit(0);
            const cfg = JSON.parse(fs.readFileSync("data/sources.json", "utf8"));
            const hit = (cfg.sources || []).find((s) => {
              const u = (typeof s === "string" ? s : s.url) || "";
              return u !== process.env.CHECK_URL && host(u) === owner;
            });
            if (hit) process.stdout.write(hit.name || hit.url);
          ')
          if [ -n "$DUP_NAME" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "error_msg=你的账号已有插件源被收录（${DUP_NAME}）。每位开发者只需提交一次源地址，新插件请直接加入你的 registry.json，下次构建会自动收录。" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "正在校验源：$URL（展示名：${NAME:-<未填写>}）"
          if npm run validate:source -- "$URL"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "error_msg=源校验未通过：无法解析到任何插件。请确认 URL 是公开可访问的 registry.json / plugin.json。" >> "$GITHUB_OUTPUT"
          fi

      # 校验失败：留言并移除 approved，便于修正后重新打标（手动触发无 Issue 上下文，跳过留言）
      - name: Comment failure
        if: steps.validate.outputs.valid != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.validate.outputs.error_msg }}` || '源校验未通过。'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ ${msg}\n\n请修正后重新提交；或移除 \`approved\` 标签后重新打标以重试。`,
            })
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'approved',
            }).catch(() => {})

      # 校验通过：追加进 sources.json
      - name: Append source to sources.json
        if: steps.validate.outputs.valid == 'true'
        id: append
        env:
          URL: ${{ steps.validate.outputs.url }}
          DISPLAY_NAME: ${{ steps.validate.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'data/sources.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const url = process.env.URL;
            const issueNo = Number(process.env.ISSUE_NUMBER) || 0;
            // 1) 同 Issue 替换：先移除该 Issue 之前提交的所有源（按 issue 编号精确匹配），
            //    实现「在原有 Issue 上改地址、重新打标即更新」而非叠加幽灵源。
            if (issueNo) {
              const before = cfg.sources.length;
              cfg.sources = cfg.sources.filter(s => !(s && typeof s === 'object' && s.issue === issueNo));
              if (cfg.sources.length < before) console.log('已移除该 Issue 之前的旧源条目（' + (before - cfg.sources.length) + ' 条），准备替换');
            }
            // 2) url 去重（双保险）：若新 url 已被其它源收录，则跳过追加
            const exists = cfg.sources.some(s => (typeof s === 'string' ? s : s.url) === url);
            if (exists) { console.log('源已存在（url 去重），跳过追加'); process.exit(0); }
            const m = process.env.URL.match(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)(?:\/([^\/]+))?/i)
              || process.env.URL.match(/github\.com\/([^\/]+)\/([^\/]+)(?:\/(?:raw\/)?([^\/]+))?/i)
              || process.env.URL.match(/raw\.giteeusercontent\.com\/([^\/]+)\/([^\/]+)(?:\/raw\/([^\/]+))?/i)
              || process.env.URL.match(/gitee\.com\/([^\/]+)\/([^\/]+)(?:\/raw\/([^\/]+))?/i);
            const owner = m ? m[1] : '';
            const repo = m ? m[2] : '';
            const ref = (m && m[3] && m[3] !== 'raw') ? m[3] : '';
            const displayName = (process.env.DISPLAY_NAME || '').trim();
            // 展示名：优先用户填写；否则只用托管平台用户名（owner），
            // 前端来源分类只显示用户名；同 owner 查重已保证一人一源，不会撞名
            const name = displayName || (owner || '自定义源');
            // id 用 owner/repo（含分支），同一 owner 下的不同源也能区分，避免 origin 碰撞
            const idBase = owner ? (owner + '-' + repo + (ref ? '-' + ref : '')) : (displayName || 'source');
            const id = idBase.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'source';
            // 记录来源 Issue 编号（可选字段，供后续同 Issue 替换；构建端会忽略未知字段）
            const entry = issueNo ? { id, url, name, issue: issueNo } : { id, url, name };
            cfg.sources.push(entry);
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
            console.log('已追加源：' + url + '（展示名：' + name + '）');
          "

      # 校验通过：直接提交到 main（不带 [skip ci]，触发 build.yml 自动构建 + 部署）
      - name: Commit source to main
        if: steps.validate.outputs.valid == 'true'
        env:
          URL: ${{ steps.validate.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sources.json
          if [ -n "$(git status --porcelain data/sources.json)" ]; then
            git commit -m "feat(source): 收录新插件源 $URL" -m "由 #$ISSUE_NUMBER 提交，审核通过（approved）后自动收录。"
            git push "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
            echo "已提交到 main，触发构建自动收录。"
          else
            echo "sources.json 无变化（可能已存在，url 去重），跳过提交。"
          fi

      # 校验通过：在 Issue 留言通知（构建会自动收录；手动触发无 Issue 上下文，跳过留言）
      - name: Comment success
        if: steps.validate.outputs.valid == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 源校验通过，已自动收录并提交到 main。\n\n构建流水线会自动展开该源下的全部插件并重新部署前端，稍后在站点即可看到。无需再手动合 PR。`,
            })
